# CLATTER 12 CI: generate the panel, run the host tests, cross-compile for Cortex-M33.
# Nothing here talks to a Plinky 12 or flashes anything.
name: build
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # clatter-pocket only; its own fm1_open submodule is not needed
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld make python3 gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Published Plinky API (pinned)
        run: sh tools/fetch-plinky-headers.sh || echo "::warning::Plinky API bundle changed or unreachable; check_api will report NOT CHECKED or fail"
      - name: Panel and host tests
        run: make CC=clang CXX=clang++ all
      - name: Cortex-M33 compile
        run: make CC=clang CXX=clang++ m33
      - name: Web build and its tests (WebAssembly engine against the native one)
        run: make CC=clang CXX=clang++ WASM_CC=clang WASM_LD=wasm-ld test-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: clatter-12-panel
          path: |
            build/clatter_12*.cpp
            build/sim/*.ppm
            build/sim/session.wav
