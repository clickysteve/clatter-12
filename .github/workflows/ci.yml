# CLATTER 12 CI: generate the panel, run the host tests, cross-compile for Cortex-M33.
# Nothing here talks to a Plinky 12 or flashes anything.
name: build
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # clatter-pocket only; its own fm1_open submodule is not needed
          fetch-depth: 0     # tools/compare_builds.sh builds an earlier revision
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld make python3 gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib qemu-system-arm
      - name: Published Plinky API (pinned)
        run: sh tools/fetch-plinky-headers.sh || echo "::warning::Plinky API bundle changed or unreachable; check_api will report NOT CHECKED or fail"
      - name: Panel and host tests
        run: make CC=clang CXX=clang++ all
      - name: Cortex-M33 compile
        run: make CC=clang CXX=clang++ m33
      - name: Instructions per audio block on a Cortex-M33 (QEMU; an estimate, not a Plinky)
        run: make CC=clang CXX=clang++ m33-bench m33-profile
      - name: The same audio as before the performance pass (0.0.3, d854eda), sample for sample
        run: CC=clang sh tools/compare_builds.sh d854eda nospread
      - name: Web build and its tests (the panel as WebAssembly)
        run: make CC=clang CXX=clang++ WASM_CC=clang WASM_LD=wasm-ld test-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: clatter-12-panel
          path: |
            build/clatter_12*.cpp
            build/sim/*.ppm
            build/sim/session.wav
  # Opt-in (a commit message containing [api-audit]): the declarations CLATTER 12 depends on, as
  # Plinky's published API bundle states them, for comparison with sim/plinky_sim.h. Short excerpts.
  api-audit:
    if: contains(github.event.head_commit.message, '[api-audit]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Published Plinky API (pinned)
        run: sh tools/fetch-plinky-headers.sh || echo "::warning::Plinky API bundle changed or unreachable"
      - name: Declarations CLATTER 12 depends on
        run: |
          wc -l build/plinky_library.h
          python3 tools/api_excerpt.py build/plinky_library.h \
            --range 2736-2760 --range 2800-2900 \
            --grep 'VOICE_PARAM_LAST,|MODULATION_TARGET_LAST,|define LFO_RECORDING_LENGTH|SYNTH_PARAM_LAST,|MIX_PARAM_LAST,|VOICE_PARAM_[A-Z0-9_]+ = ' \
            --grep 'enum.*voice_param|enum.*modulation_target|typedef enum' --grep 'char song_name|char name\[' \
            --grep 'sample_ref|struct preset_slice|slice_t'
